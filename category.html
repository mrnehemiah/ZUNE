  </nav>  <!-- HTML CONTROLS THAT CONNECT TO category.js -->  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const resetButton = document.getElementById('resetFiltersBtn');
      const showAllButton = document.getElementById('showAllCategoriesBtn');
      const searchInput = document.getElementById('catSearchInput');
      const minInput = document.getElementById('minPriceInput');
      const maxInput = document.getElementById('maxPriceInput');
      const filterMessage = document.getElementById('filterMessage');

      function resetFilters() {
        if (searchInput) searchInput.value = '';
        if (minInput) minInput.value = '';
        if (maxInput) maxInput.value = '';

        if (typeof window.filterByCategory === 'function') {
          window.filterByCategory('');
        }

        document.querySelectorAll('.category-card').forEach(button => {
          button.classList.remove('is-active');
        });

        if (filterMessage) {
          filterMessage.classList.add('hidden');
          filterMessage.textContent = '';
        }
      }

      if (resetButton) {
        resetButton.addEventListener('click', resetFilters);
      }

      if (showAllButton) {
        showAllButton.addEventListener('click', resetFilters);
      }

      function validatePrices() {
        if (!filterMessage) return;

        const min = minInput && minInput.value !== ''
          ? Number(minInput.value)
          : null;

        const max = maxInput && maxInput.value !== ''
          ? Number(maxInput.value)
          : null;

        if (
          (min !== null && (!Number.isFinite(min) || min < 0)) ||
          (max !== null && (!Number.isFinite(max) || max < 0))
        ) {
          filterMessage.textContent = 'Weka bei sahihi isiyo chini ya sifuri.';
          filterMessage.classList.remove('hidden');
          return;
        }

        if (min !== null && max !== null && min > max) {
          filterMessage.textContent = 'Bei ya chini haiwezi kuzidi bei ya juu.';
          filterMessage.classList.remove('hidden');
          return;
        }

        filterMessage.classList.add('hidden');
        filterMessage.textContent = '';
      }

      [minInput, maxInput].forEach(input => {
        if (input) {
          input.addEventListener('change', validatePrices);
        }
      });

      document.querySelectorAll('.category-card').forEach(button => {
        button.addEventListener('click', function () {
          document.querySelectorAll('.category-card').forEach(item => {
            item.classList.remove('is-active');
          });

          button.classList.add('is-active');

          if (filterMessage) {
            filterMessage.classList.add('hidden');
            filterMessage.textContent = '';
          }
        });
      });
    });
  </script></body>
