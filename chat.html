<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZUNE - Mazungumzo (Chat)</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts & FontAwesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-brand { font-family: 'Space Grotesk', sans-serif; }
    .stylish-gradient { background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #2563eb 100%); }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased h-screen flex flex-col">

  <!-- TOP HEADER BAR -->
  <header class="stylish-gradient text-white py-3.5 px-4 shadow-md shrink-0">
    <div class="container mx-auto flex items-center justify-between max-w-xl">
      <a href="./index.html" class="flex items-center gap-2 text-white hover:text-sky-300 font-bold text-xs transition">
        <i class="fa-solid fa-arrow-left text-sm"></i> Rudi Sokoni
      </a>
      <div class="flex items-center gap-2">
        <div class="h-2.5 w-2.5 rounded-full bg-emerald-400 animate-pulse"></div>
        <span class="font-brand text-sm font-bold tracking-tight text-white" id="chatPartnerName">Muuzaji wa ZUNE</span>
      </div>
    </div>
  </header>

  <!-- CHAT MESSAGES CONTAINER -->
  <main class="flex-1 overflow-y-auto p-4 container mx-auto max-w-xl space-y-3" id="chatBox">
    <!-- Messages zitajazwa hapa na Script ya chini -->
  </main>

  <!-- CHAT INPUT BAR -->
  <footer class="bg-white border-t border-slate-200 p-3 shrink-0 shadow-lg">
    <form id="chatForm" class="container mx-auto max-w-xl flex items-center gap-2">
      <input type="text" id="chatInput" required placeholder="Andika ujumbe wako hapa..." class="flex-1 bg-slate-100 border border-slate-200 rounded-2xl px-4 py-3 text-xs focus:outline-none focus:border-blue-600 font-medium">
      <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white p-3 rounded-2xl shadow-md transition shrink-0">
        <i class="fa-solid fa-paper-plane text-sm"></i>
      </button>
    </form>
  </footer>

  <!-- EMBEDDED DIRECT CHAT SCRIPT -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('chatForm')
      if (form) {
        form.addEventListener('submit', handleSendMessage)
      }
      renderChatHistory()
    })

    function getMessages() {
      try {
        const stored = localStorage.getItem('zune_chat_history')
        if (stored) {
          return JSON.parse(stored)
        }
      } catch (e) {
        console.log("Error reading chat history:", e)
      }
      return [
        { sender: 'seller', text: 'Jambo! Karibu ZUNE. Je, unahitaji msaada gani kuhusu bidhaa hii?', time: 'Sasa hivi' }
      ]
    }

    function renderChatHistory() {
      const box = document.getElementById('chatBox')
      if (!box) return

      const msgs = getMessages()
      box.innerHTML = ''

      msgs.forEach(m => {
        const div = document.createElement('div')
        const isMe = m.sender === 'user'

        div.className = `flex ${isMe ? 'justify-end' : 'justify-start'}`
        div.innerHTML = `
          <div class="max-w-[80%] rounded-2xl px-4 py-2.5 text-xs shadow-sm ${isMe ? 'bg-blue-600 text-white rounded-br-none' : 'bg-white border border-slate-200 text-slate-800 rounded-bl-none'}">
            <p class="leading-relaxed">${m.text}</p>
            <span class="text-[9px] block text-right mt-1 ${isMe ? 'text-blue-200' : 'text-slate-400'}">${m.time}</span>
          </div>
        `
        box.appendChild(div)
      })

      box.scrollTop = box.scrollHeight
    }

    function handleSendMessage(e) {
      e.preventDefault()
      const input = document.getElementById('chatInput')
      if (!input || !input.value.trim()) return

      const msgs = getMessages()
      const now = new Date().toLocaleTimeString('sw-TZ', { hour: '2-digit', minute: '2-digit' })

      const textValue = input.value.trim()
      msgs.push({ sender: 'user', text: textValue, time: now })
      localStorage.setItem('zune_chat_history', JSON.stringify(msgs))

      input.value = ''
      renderChatHistory()

      // Majibu ya papo hapo ya muuzaji (Auto Reply)
      setTimeout(() => {
        const updated = getMessages()
        updated.push({ 
          sender: 'seller', 
          text: 'Asante kwa ujumbe wako! Muuzaji anaangalia taarifa za bidhaa na atakujibu mara moja.', 
          time: new Date().toLocaleTimeString('sw-TZ', { hour: '2-digit', minute: '2-digit' }) 
        })
        localStorage.setItem('zune_chat_history', JSON.stringify(updated))
        renderChatHistory()
      }, 1200)
    }
  </script>

</body>
</html>
