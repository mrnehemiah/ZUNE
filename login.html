
<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <title>ZUNE - Ingia Kwenye Akaunti</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-brand { font-family: 'Space Grotesk', sans-serif; }
    .login-card { box-shadow: 0 25px 70px rgba(0,0,0,.25); }
    .field:focus-within {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,.10);
    }
    .field input { outline: none; }
    button:disabled { opacity: .65; cursor: not-allowed; }
  </style>
</head>

<body class="bg-slate-900 text-slate-800 antialiased min-h-screen flex items-center justify-center p-4">
  <main class="w-full max-w-md">
    <section class="login-card bg-white p-6 sm:p-8 rounded-3xl border border-slate-100">
      <div class="text-center mb-7">
        <div class="h-16 w-16 bg-blue-600 rounded-2xl mx-auto flex items-center justify-center text-white text-3xl font-bold shadow-lg shadow-blue-500/30 mb-4 font-brand">Z</div>
        <h1 class="text-2xl font-extrabold text-slate-900 font-brand">Karibu Tena ZUNE</h1>
        <p class="text-sm text-slate-500 mt-2">Ingia kwenye akaunti yako ili kuendelea na soko.</p>
      </div>

      <div id="messageBox" class="hidden mb-4 rounded-xl p-3 text-sm" role="alert" aria-live="polite"></div>

      <form id="loginForm" class="space-y-5">
        <div>
          <label for="loginContact" class="block text-sm font-bold text-slate-700 mb-2">Barua pepe au simu</label>
          <div class="field flex items-center gap-3 w-full bg-slate-50 border border-slate-200 rounded-xl px-4 transition">
            <i class="fa-solid fa-user text-slate-400"></i>
            <input type="text" id="loginContact" name="contact" autocomplete="username" required class="w-full bg-transparent py-3 text-sm font-medium" placeholder="juma@example.com">
          </div>
          <p class="text-xs text-slate-400 mt-2">Kwa simu, tumia namba yenye country code, mfano +255712345678.</p>
        </div>

        <div>
          <label for="loginPassword" class="block text-sm font-bold text-slate-700 mb-2">Neno la siri</label>
          <div class="field flex items-center gap-3 w-full bg-slate-50 border border-slate-200 rounded-xl px-4 transition">
            <i class="fa-solid fa-lock text-slate-400"></i>
            <input type="password" id="loginPassword" name="password" autocomplete="current-password" required class="w-full bg-transparent py-3 text-sm font-medium" placeholder="Ingiza neno lako la siri">
            <button type="button" id="togglePassword" class="text-slate-400 hover:text-blue-600" aria-label="Onyesha au ficha password">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>

        <div class="text-right">
          <a href="./forgot-password.html" class="text-sm font-bold text-blue-600 hover:underline">Umesahau neno la siri?</a>
        </div>

        <button type="submit" id="loginButton" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl shadow-lg shadow-blue-500/20 text-sm transition flex items-center justify-center gap-2">
          <i class="fa-solid fa-right-to-bracket"></i>
          <span>Ingia Kwenye Akaunti</span>
        </button>
      </form>

      <div class="relative my-6"><div class="border-t border-slate-200"></div></div>

      <p class="text-center text-sm text-slate-500">
        Huna akaunti bado?
        <a href="./signup.html" class="text-blue-600 font-extrabold hover:underline">Jisajili hapa</a>
      </p>

      <p class="text-center text-xs text-slate-400 mt-6">ZUNE Marketplace · Akaunti yako inalindwa</p>
    </section>
  </main>

  <script type="module">
    import { createClient } from
      'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

    const SUPABASE_URL = 'https://rpkogiieegqgxqbzwxwo.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_2TEqZv-NBM9n5knU46ngqA_wqO3V1uf';

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const form = document.getElementById('loginForm');
    const contactInput = document.getElementById('loginContact');
    const passwordInput = document.getElementById('loginPassword');
    const loginButton = document.getElementById('loginButton');
    const messageBox = document.getElementById('messageBox');
    const togglePassword = document.getElementById('togglePassword');

    function showMessage(message, type = 'error') {
      messageBox.textContent = message;
      messageBox.className = 'mb-4 rounded-xl p-3 text-sm';

      messageBox.classList.add(
        ...(type === 'success'
          ? ['bg-green-50', 'text-green-700', 'border', 'border-green-200']
          : ['bg-red-50', 'text-red-700', 'border', 'border-red-200'])
      );
    }

    function normalizeTanzanianPhone(value) {
      let phone = value.replace(/[\s()-]/g, '');

      if (/^0[67]\d{8}$/.test(phone)) {
        phone = '+255' + phone.slice(1);
      } else if (/^255[67]\d{8}$/.test(phone)) {
        phone = '+' + phone;
      }

      return phone;
    }

    togglePassword.addEventListener('click', () => {
      const show = passwordInput.type === 'password';
      passwordInput.type = show ? 'text' : 'password';
      togglePassword.innerHTML = show
        ? '<i class="fa-solid fa-eye-slash"></i>'
        : '<i class="fa-solid fa-eye"></i>';
    });

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      messageBox.className = 'hidden mb-4 rounded-xl p-3 text-sm';
      messageBox.textContent = '';

      const contact = contactInput.value.trim();
      const password = passwordInput.value;

      if (!contact || !password) {
        showMessage('Tafadhali jaza taarifa zote zinazohitajika.');
        return;
      }

      let credentials;

      if (contact.includes('@')) {
        credentials = { email: contact, password };
      } else {
        const phone = normalizeTanzanianPhone(contact);

        if (!/^\+[1-9]\d{7,14}$/.test(phone)) {
          showMessage('Ingiza email sahihi au simu yenye country code, mfano +255712345678.');
          return;
        }

        credentials = { phone, password };
      }

      loginButton.disabled = true;
      loginButton.innerHTML =
        '<i class="fa-solid fa-spinner fa-spin"></i><span>Inathibitisha...</span>';

      try {
        const { data, error } =
          await supabase.auth.signInWithPassword(credentials);

        if (error) {
          console.error('Login error:', error.message);
          showMessage('Imeshindikana kuingia. Hakikisha email/simu na nenosiri ni sahihi.');
          return;
        }

        if (!data.user || !data.session) {
          showMessage('Session haikupatikana. Tafadhali jaribu tena.');
          return;
        }

        const { data: profile, error: profileError } = await supabase
          .from('profiles')
          .select('id, full_name, role')
          .eq('id', data.user.id)
          .maybeSingle();

        if (profileError) {
          console.error('Profile lookup diagnostic:', {
            code: profileError.code,
            message: profileError.message,
            userId: data.user.id
          });

          showMessage(
            `Umeingia, lakini profile haikuweza kusomwa. Hitilafu: ${profileError.code || 'haijulikani'}.`
          );
          return;
        }

        if (!profile) {
          console.error('No profile returned for authenticated user ID:', data.user.id);
          showMessage('Umeingia, lakini profile haikupatikana kwa akaunti hii. Tafadhali wasiliana na msaada.');
          return;
        }

        if (!['admin', 'buyer', 'vendor'].includes(profile.role)) {
          console.error('Unexpected profile role:', profile.role);
          showMessage('Role ya akaunti haijatambulika. Tafadhali wasiliana na msaada.');
          return;
        }

        showMessage('Umeingia kikamilifu. Inaelekeza...', 'success');

        // Kwa sasa njia zote mbili zimeachwa kama zilivyokuwa kwenye code yako.
        // Badilisha destination tu baada ya kuthibitisha ukurasa sahihi wa admin.
        window.location.href = './index.html';

      } catch (error) {
        console.error('Login exception:', error);
        showMessage('Hitilafu ya mtandao au mfumo imetokea. Tafadhali jaribu tena.');
      } finally {
        loginButton.disabled = false;
        loginButton.innerHTML =
          '<i class="fa-solid fa-right-to-bracket"></i><span>Ingia Kwenye Akaunti</span>';
      }
    });
  </script>
</body>
</html>
