<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZUNE - Ingia (Login)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white p-8 rounded-3xl border border-slate-200 shadow-xl max-w-md w-full">
    <div class="text-center mb-6">
      <a href="./index.html" class="inline-block bg-blue-600 text-white p-3 rounded-2xl shadow-lg mb-3">
        <i class="fa-solid fa-cart-shopping text-xl"></i>
      </a>
      <h2 class="text-2xl font-bold text-slate-900">Karibu Tena ZUNE</h2>
      <p class="text-xs text-slate-400 mt-1">Ingiza namba yako ya simu kuingia kwenye akaunti yako</p>
    </div>

    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Namba ya Simu *</label>
        <input type="tel" id="loginPhone" required placeholder="Mfano: 0712345678" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-xs focus:outline-none focus:border-blue-600">
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Neno la Siri (Password) *</label>
        <input type="password" id="loginPassword" required placeholder="••••••••" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-xs focus:outline-none focus:border-blue-600">
      </div>
      <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-2xl shadow-lg shadow-blue-500/20 text-xs transition">
        Ingia Kwenye Akaunti
      </button>
    </form>

    <p class="text-center text-xs text-slate-500 mt-6">
       Haujaandikishwa? <a href="./signup.html" class="text-blue-600 font-bold hover:underline">Jisajili hapa</a>
    </p>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault()
      const phone = document.getElementById('loginPhone').value
      
      localStorage.setItem('zune_user_phone', phone)
      alert("Umeingia kwenye akaunti kwa mafanikio!")
      window.location.href = './account.html'
    })
  </script>
</body>
</html>
