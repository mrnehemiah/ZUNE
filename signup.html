
<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <title>ZUNE | Jisajili</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .card { box-shadow: 0 25px 70px rgba(0,0,0,.25); }
    .field { border: 1px solid #e2e8f0; }
    .field:focus-within {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,.1);
    }
    input { outline: none; min-width: 0; }
    .method { border: 2px solid #e2e8f0; color: #64748b; }
    .method.active {
      border-color: #2563eb;
      color: #1d4ed8;
      background: #eff6ff;
    }
    button:disabled { opacity: .6; cursor: not-allowed; }
  </style>
</head>

<body class="min-h-screen bg-slate-900 flex items-center justify-center p-4">

<main class="w-full max-w-lg">
  <section class="card bg-white rounded-3xl p-6 sm:p-8">

    <header class="text-center mb-7">
      <div class="w-16 h-16 rounded-2xl bg-blue-600 text-white text-3xl font-extrabold flex items-center justify-center mx-auto mb-4">
        Z
      </div>
      <h1 class="text-2xl font-extrabold text-slate-900">Jiunge na ZUNE</h1>
      <p class="text-sm text-slate-500 mt-2">
        Fungua akaunti yako na uanze kutumia ZUNE Marketplace.
      </p>
    </header>

    <div id="messageBox"
         role="alert"
         aria-live="polite"
         class="hidden rounded-xl p-3 mb-5 text-sm">
    </div>

    <form id="signupForm" class="space-y-5">

      <div>
        <label for="fullName"
               class="block text-sm font-bold text-slate-700 mb-2">
          Jina kamili
        </label>
        <input id="fullName"
               name="fullName"
               type="text"
               autocomplete="name"
               required
               maxlength="100"
               class="field w-full rounded-xl bg-slate-50 px-4 py-3 text-sm"
               placeholder="Ingiza jina lako kamili">
      </div>

      <div>
        <label class="block text-sm font-bold text-slate-700 mb-3">
          Chagua njia ya usajili
        </label>

        <div class="grid grid-cols-2 gap-3">
          <button type="button"
                  id="phoneTab"
                  aria-pressed="true"
                  class="method active rounded-xl py-3 font-bold text-sm">
            <i class="fa-solid fa-phone mr-2"></i> Simu
          </button>

          <button type="button"
                  id="emailTab"
                  aria-pressed="false"
                  class="method rounded-xl py-3 font-bold text-sm">
            <i class="fa-solid fa-envelope mr-2"></i> Email
          </button>
        </div>
      </div>

      <div>
        <label id="contactLabel"
               for="contact"
               class="block text-sm font-bold text-slate-700 mb-2">
          Namba ya simu
        </label>

        <input id="contact"
               name="contact"
               type="tel"
               autocomplete="tel"
               required
               class="field w-full rounded-xl bg-slate-50 px-4 py-3 text-sm"
               placeholder="+255712345678">

        <p id="contactHint" class="text-xs text-slate-400 mt-2">
          Usajili wa simu hautahitaji OTP, ikiwa Supabase imesanidiwa kuruhusu hivyo.
        </p>
      </div>

      <div>
        <label for="password"
               class="block text-sm font-bold text-slate-700 mb-2">
          Neno la siri
        </label>
        <input id="password"
               type="password"
               autocomplete="new-password"
               minlength="8"
               required
               class="field w-full rounded-xl bg-slate-50 px-4 py-3 text-sm"
               placeholder="Angalau herufi 8">
      </div>

      <div>
        <label for="confirmPassword"
               class="block text-sm font-bold text-slate-700 mb-2">
          Rudia neno la siri
        </label>
        <input id="confirmPassword"
               type="password"
               autocomplete="new-password"
               minlength="8"
               required
               class="field w-full rounded-xl bg-slate-50 px-4 py-3 text-sm"
               placeholder="Thibitisha neno la siri">
      </div>

      <label class="flex items-start gap-3 text-sm text-slate-600">
        <input id="terms"
               type="checkbox"
               required
               class="mt-1">
        <span>Ninakubali masharti ya matumizi na sera ya faragha ya ZUNE.</span>
      </label>

      <button id="signupButton"
              type="submit"
              class="w-full rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 text-sm">
        <i class="fa-solid fa-user-plus mr-2"></i>
        Fungua Akaunti
      </button>

    </form>

    <p class="text-center text-sm text-slate-500 mt-6">
      Tayari una akaunti?
      <a href="./login.html"
         class="font-extrabold text-blue-600 hover:underline">
        Ingia hapa
      </a>
    </p>

    <p class="text-center text-xs text-slate-400 mt-5">
      ZUNE Marketplace · Akaunti yako inalindwa
    </p>

  </section>
</main>

<script type="module">
  import { createClient } from
    'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

  const supabase = createClient(
    'https://rpkogiieegqgxqbzwxwo.supabase.co',
    'sb_publishable_2TEqZv-NBM9n5knU46ngqA_wqO3V1uf'
  );

  const form = document.getElementById('signupForm');
  const fullName = document.getElementById('fullName');
  const contact = document.getElementById('contact');
  const password = document.getElementById('password');
  const confirmPassword = document.getElementById('confirmPassword');
  const signupButton = document.getElementById('signupButton');
  const messageBox = document.getElementById('messageBox');

  const phoneTab = document.getElementById('phoneTab');
  const emailTab = document.getElementById('emailTab');
  const contactLabel = document.getElementById('contactLabel');
  const contactHint = document.getElementById('contactHint');

  let method = 'phone';

  function message(text, success = false) {
    messageBox.textContent = text;
    messageBox.className =
      'rounded-xl p-3 mb-5 text-sm ' +
      (success
        ? 'bg-green-50 text-green-700 border border-green-200'
        : 'bg-red-50 text-red-700 border border-red-200');
  }

  function clearMessage() {
    messageBox.textContent = '';
    messageBox.className = 'hidden rounded-xl p-3 mb-5 text-sm';
  }

  function chooseMethod(next) {
    method = next;
    const isPhone = next === 'phone';

    phoneTab.classList.toggle('active', isPhone);
    emailTab.classList.toggle('active', !isPhone);

    phoneTab.setAttribute('aria-pressed', String(isPhone));
    emailTab.setAttribute('aria-pressed', String(!isPhone));

    contactLabel.textContent = isPhone
      ? 'Namba ya simu'
      : 'Barua pepe';

    contact.type = isPhone ? 'tel' : 'email';
    contact.autocomplete = isPhone ? 'tel' : 'email';
    contact.placeholder = isPhone
      ? '+255712345678'
      : 'juma@example.com';

    contactHint.textContent = isPhone
      ? 'Hakuna OTP ya simu; akaunti lazima iruhusiwe na mipangilio ya Supabase.'
      : 'Utapokea msimbo wa uthibitishaji kwenye email yako.';

    contact.value = '';
    clearMessage();
  }

  phoneTab.addEventListener('click', () => chooseMethod('phone'));
  emailTab.addEventListener('click', () => chooseMethod('email'));

  function normalizePhone(value) {
    let phone = value.trim().replace(/[\s()-]/g, '');

    if (/^0[67]\d{8}$/.test(phone)) {
      phone = '+255' + phone.slice(1);
    } else if (/^255[67]\d{8}$/.test(phone)) {
      phone = '+' + phone;
    }

    return phone;
  }

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    clearMessage();

    const name = fullName.value.trim();
    const identifier = contact.value.trim();
    const secret = password.value;

    if (name.length < 2) {
      message('Tafadhali ingiza jina lako kamili.');
      return;
    }

    if (secret.length < 8) {
      message('Neno la siri lazima liwe na angalau herufi 8.');
      return;
    }

    if (secret !== confirmPassword.value) {
      message('Maneno ya siri hayafanani.');
      return;
    }

    if (!document.getElementById('terms').checked) {
      message('Tafadhali kubali masharti ya matumizi.');
      return;
    }

    let credentials;

    if (method === 'email') {
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(identifier)) {
        message('Tafadhali ingiza email sahihi.');
        return;
      }

      credentials = {
        email: identifier,
        password: secret,
        options: {
          data: {
            full_name: name
          }
        }
      };
    } else {
      const phone = normalizePhone(identifier);

      if (!/^\+[1-9]\d{7,14}$/.test(phone)) {
        message('Namba si sahihi. Mfano: +255712345678.');
        return;
      }

      credentials = {
        phone,
        password: secret,
        options: {
          data: {
            full_name: name
          }
        }
      };
    }

    signupButton.disabled = true;
    signupButton.textContent = 'Inatengeneza akaunti...';

    try {
      const { data, error } = await supabase.auth.signUp(credentials);

      if (error) {
        console.error('Signup error:', error.message);
        message('Usajili umeshindikana. ' + error.message);
        return;
      }

      if (method === 'email') {
        if (data.session && data.user) {
          message(
            'Akaunti imetengenezwa. Hakikisha email imethibitishwa kabla ya kuendelea.',
            true
          );
        } else {
          message(
            'Ombi la usajili limepokelewa. Angalia email yako kwa OTP ya uthibitishaji. Profile itaundwa baada ya uthibitishaji kupitia usanidi wa database.',
            true
          );
        }
      } else {
        if (data.session && data.user) {
          message(
            'Akaunti imetengenezwa. Unaweza kuendelea kuingia.',
            true
          );
        } else {
          message(
            'Supabase haijakupa session. Kagua mipangilio ya uthibitishaji wa simu kabla ya kujaribu tena.'
          );
          return;
        }
      }

      // Usitengeneze profile kwa browser bila kuhakikisha session na
      // muundo wa database. Database trigger inaweza kuunda profile
      // kwa usalama kwa kutumia auth.users na role ya kawaida ya buyer.

    } catch (error) {
      console.error('Signup exception:', error);
      message('Hitilafu ya mtandao imetokea. Tafadhali jaribu tena.');
    } finally {
      signupButton.disabled = false;
      signupButton.innerHTML =
        '<i class="fa-solid fa-user-plus mr-2"></i> Fungua Akaunti';
    }
  });
</script>

</body>
</html>
