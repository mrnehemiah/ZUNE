<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZUNE - Kikapu & Kutuma Oda</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts & FontAwesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-brand { font-family: 'Space Grotesk', sans-serif; }
    .stylish-gradient { background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #2563eb 100%); }
  </style>

  <script src="./cart.js" defer></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased pb-24">

  <!-- TOP HEADER BAR -->
  <header class="stylish-gradient text-white py-3 px-4 shadow-md sticky top-0 z-50">
    <div class="container mx-auto flex items-center justify-between max-w-xl">
      <a href="./index.html" class="flex items-center gap-2 text-white hover:text-sky-300 font-bold text-xs transition">
        <i class="fa-solid fa-arrow-left text-sm"></i> Rudi Mwanzo
      </a>
      <span class="font-brand text-xl font-bold tracking-tight text-white">KIKAPU CHANGU</span>
    </div>
  </header>

  <main class="container mx-auto px-4 my-6 max-w-xl">
    
    <!-- ORODHA YA BIDHAA ZILIZO KWENYE KIKAPU -->
    <div class="bg-white rounded-3xl p-5 border border-slate-100 shadow-sm mb-6">
      <div class="flex items-center justify-between mb-4 border-b border-slate-100 pb-3">
        <h3 class="font-brand font-bold text-sm text-slate-800">Bidhaa Kwenye Kikapu</h3>
        <button onclick="clearCart()" class="text-[11px] text-rose-500 font-bold hover:underline flex items-center gap-1">
          <i class="fa-solid fa-trash-can"></i> Safisha Kikapu
        </button>
      </div>

      <div id="cart-items-container" class="space-y-3">
        <!-- Zitajazwa na cart.js -->
      </div>
    </div>

    <!-- MUHTASARI WA GHARAMA -->
    <div class="bg-white rounded-3xl p-5 border border-slate-100 shadow-sm mb-6">
      <h3 class="font-brand font-bold text-sm text-slate-800 mb-3 border-b border-slate-100 pb-2">Muhtasari wa Gharama</h3>
      
      <div class="space-y-2 text-xs">
        <div class="flex justify-between text-slate-600">
          <span>Jumla ya Bidhaa (Subtotal):</span>
          <span id="subtotal-price" class="font-bold text-slate-800">TZS 0</span>
        </div>
        <div class="flex justify-between text-slate-600">
          <span>Gharama za Usafirishaji:</span>
          <span class="text-emerald-600 font-bold">BURE (Free)</span>
        </div>
        <div class="flex justify-between text-sm font-bold text-slate-900 pt-2 border-t border-slate-100">
          <span>Jumla Kuu (Total):</span>
          <span id="total-price" class="font-brand text-blue-600 text-base">TZS 0</span>
        </div>
      </div>
    </div>

    <!-- FOMU YA KUTUMA ODA & NJIA ZA MALIPO -->
    <div class="bg-white rounded-3xl p-5 border border-slate-100 shadow-sm">
      <h3 class="font-brand font-bold text-sm text-slate-800 mb-4 border-b border-slate-100 pb-2">Taarifa za Anwani na Malipo</h3>

      <form id="checkoutForm" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Jina Kamili la Mpokeaji *</label>
          <input type="text" id="custName" required placeholder="Mfano: Juma Rashid" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-xs focus:outline-none focus:border-blue-600">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Namba ya Simu *</label>
          <input type="tel" id="custPhone" required placeholder="Mfano: 0712345678" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-xs focus:outline-none focus:border-blue-600">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Anwani / Mahali Unapoishi (Mkoa, Wilaya, Mtaa) *</label>
          <input type="text" id="custAddress" required placeholder="Mfano: Dar es Salaam, Kinondoni, Makumbusho" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-xs focus:outline-none focus:border-blue-600">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Njia ya Malipo *</label>
          <select id="paymentMethod" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-xs focus:outline-none focus:border-blue-600 font-medium">
            <option value="Wallet">ZUNE Wallet (Salio)</option>
            <option value="M-Pesa">M-Pesa / Tigo Pesa / Airtel Money</option>
            <option value="COD">Lipa Ukipokea Bidhaa (Cash on Delivery)</option>
          </select>
        </div>

        <button type="submit" id="placeOrderBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-2xl shadow-lg shadow-blue-500/20 transition duration-300 text-xs flex items-center justify-center gap-2 mt-4">
          <i class="fa-solid fa-check-circle"></i> Thibitisha & Tuma Oda
        </button>
      </form>
    </div>

  </main>

  <!-- MOBILE BOTTOM NAVIGATION BAR -->
  <div class="md:hidden fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-slate-200 py-2.5 px-4 z-50 shadow-lg">
    <div class="flex justify-between items-center max-w-md mx-auto">
      <a href="./index.html" class="flex flex-col items-center text-slate-500 hover:text-blue-600 transition">
        <i class="fa-solid fa-house text-lg"></i>
        <span class="text-[10px] mt-1">Mwanzo</span>
      </a>
      <a href="./category.html" class="flex flex-col items-center text-slate-500 hover:text-blue-600 transition">
        <i class="fa-solid fa-layer-group text-lg"></i>
        <span class="text-[10px] mt-1">Kategoria</span>
      </a>
      <a href="./seller.html" class="flex flex-col items-center -mt-6">
        <div class="bg-gradient-to-r from-blue-600 to-indigo-600 text-white h-12 w-12 rounded-full flex items-center justify-center shadow-lg shadow-blue-500/40 border-4 border-slate-50">
          <i class="fa-solid fa-plus text-xl"></i>
        </div>
        <span class="text-[10px] mt-0.5 font-bold text-slate-700">Uza Bidhaa</span>
      </a>
      <a href="./wallet.html" class="flex flex-col items-center text-slate-500 hover:text-blue-600 transition">
        <i class="fa-solid fa-wallet text-lg"></i>
        <span class="text-[10px] mt-1">Wallet</span>
      </a>
      <a href="./notification.html" class="flex flex-col items-center text-slate-500 hover:text-blue-600 transition">
        <i class="fa-regular fa-bell text-lg"></i>
        <span class="text-[10px] mt-1">Taarifa</span>
      </a>
    </div>
  </div>

</body>
</html>
