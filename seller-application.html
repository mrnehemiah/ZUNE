<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#15803d">
  <title>ZUNE - Maombi ya Muuzaji</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px 12px;
      background: #f1f5f9;
      color: #172033;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 650px;
      margin: auto;
      background: white;
      padding: 22px;
      border-radius: 16px;
      box-shadow: 0 5px 25px #0000000d;
    }

    h1 {
      text-align: center;
      color: #15803d;
      margin-top: 0;
    }

    .subtitle {
      text-align: center;
      color: #64748b;
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-weight: bold;
      margin: 16px 0 7px;
    }

    input, select {
      width: 100%;
      padding: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      background: white;
      font-size: 16px;
    }

    input:focus, select:focus {
      outline: 2px solid #86efac;
      border-color: #15803d;
    }

    .countries {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .country-card {
      padding: 14px 5px;
      background: white;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      cursor: pointer;
      text-align: center;
      color: #172033;
      font-size: 14px;
    }

    .country-card .flag {
      display: block;
      font-size: 32px;
      margin-bottom: 7px;
    }

    .country-card.active {
      border-color: #16a34a;
      background: #f0fdf4;
    }

    .section-title {
      margin-top: 25px;
      padding-bottom: 9px;
      border-bottom: 1px solid #e2e8f0;
      color: #15803d;
    }

    .hint {
      font-size: 13px;
      color: #64748b;
      line-height: 1.5;
    }

    button.submit {
      width: 100%;
      margin-top: 24px;
      padding: 15px;
      background: #15803d;
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button.submit:disabled {
      opacity: .6;
      cursor: wait;
    }

    #message {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      display: none;
      line-height: 1.5;
    }

    #message.error {
      display: block;
      color: #991b1b;
      background: #fee2e2;
    }

    #message.success {
      display: block;
      color: #166534;
      background: #dcfce7;
    }

    .hidden { display: none !important; }
  </style>
</head>

<body>
  <main class="container">
    <h1>ZUNE</h1>
    <p class="subtitle">Fomu ya kuomba akaunti ya muuzaji</p>

    <form id="sellerForm">
      <h3 class="section-title">1. Chagua nchi yako</h3>

      <div class="countries">
        <button type="button"
          class="country-card"
          data-country="tz">
          <span class="flag">🇹🇿</span>
          Tanzania
        </button>

        <button type="button"
          class="country-card"
          data-country="ke">
          <span class="flag">🇰🇪</span>
          Kenya
        </button>

        <button type="button"
          class="country-card"
          data-country="ug">
          <span class="flag">🇺🇬</span>
          Uganda
        </button>
      </div>

      <input type="hidden" id="country" required>

      <h3 class="section-title">2. Taarifa za biashara</h3>

      <label for="store_name">Jina la duka/biashara *</label>
      <input id="store_name" required maxlength="150"
        placeholder="Mfano: Nehemiah Shop">

      <label for="owner_name">Jina kamili la mmiliki *</label>
      <input id="owner_name" required maxlength="150"
        placeholder="Andika jina lako kamili">

      <label for="phone">Namba ya simu *</label>
      <input id="phone" type="tel" required maxlength="25"
        placeholder="Mfano: +255...">

      <label for="email">Barua pepe</label>
      <input id="email" type="email" maxlength="254"
        placeholder="example@email.com">

      <label for="category">Aina ya biashara *</label>
      <select id="category" required>
        <option value="">-- Chagua aina ya biashara --</option>
        <option value="Clothing">Nguo na viatu</option>
        <option value="Electronics">Elektroniki</option>
        <option value="Food">Chakula na vinywaji</option>
        <option value="Beauty">Urembo</option>
        <option value="Home">Vifaa vya nyumbani</option>
        <option value="Health">Bidhaa za afya</option>
        <option value="Other">Nyingine</option>
      </select>

      <h3 class="section-title">3. Eneo la biashara</h3>

      <p class="hint">
        Chagua maeneo kwa mpangilio. Orodha itabadilika kulingana
        na nchi uliyochagua.
      </p>

      <div id="locationFields">
        <label id="loc1Label" for="loc1">Eneo la kwanza *</label>
        <select id="loc1" required disabled>
          <option value="">Chagua nchi kwanza</option>
        </select>

        <label id="loc2Label" for="loc2">Eneo la pili *</label>
        <select id="loc2" required disabled>
          <option value="">Chagua eneo la kwanza</option>
        </select>

        <label id="loc3Label" for="loc3">Eneo la tatu *</label>
        <select id="loc3" required disabled>
          <option value="">Chagua eneo la pili</option>
        </select>

        <div id="loc4Wrap" class="hidden">
          <label id="loc4Label" for="loc4">Eneo la nne *</label>
          <select id="loc4" disabled>
            <option value="">Chagua eneo la tatu</option>
          </select>
        </div>
      </div>

      <label for="street">Mtaa/Kijiji au maelezo ya eneo</label>
      <input id="street" maxlength="200"
        placeholder="Andika mtaa au kijiji">

      <label for="tin_number">TIN (ikiwa unayo)</label>
      <input id="tin_number" maxlength="50"
        placeholder="Namba ya TIN">

      <label for="id_type">Aina ya kitambulisho</label>
      <select id="id_type">
        <option value="">-- Chagua --</option>
        <option value="National ID">Kitambulisho cha taifa</option>
        <option value="Passport">Pasipoti</option>
        <option value="Driving Licence">Leseni ya udereva</option>
        <option value="Other">Nyingine</option>
      </select>

      <label for="id_number">Namba ya kitambulisho</label>
      <input id="id_number" maxlength="100"
        placeholder="Namba ya kitambulisho">

      <button class="submit" id="submitBtn" type="submit">
        Tuma maombi
      </button>

      <div id="message" role="status" aria-live="polite"></div>
    </form>
  </main>

 <script type="module">
import { createClient } from
  "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

/* =========================================
   1. SUPABASE CONFIGURATION
   ========================================= */

const SUPABASE_URL =
  "https://rpkogiieegqgxqbzwxwo.supabase.co";

// WEKA PUBLIC/PUBLISHABLE KEY YAKO YA SASA HAPA.
// USIWEKE service_role key kwenye browser.
const SUPABASE_ANON_KEY = "WEKA_PUBLISHABLE_KEY_YAKO_HAPA";

const supabase = createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

/* =========================================
   2. ELEMENTS
   ========================================= */

const form = document.getElementById("sellerForm");
const countryInput = document.getElementById("country");
const message = document.getElementById("message");
const submitBtn = document.getElementById("submitBtn");

const locationSelects = [
  document.getElementById("loc1"),
  document.getElementById("loc2"),
  document.getElementById("loc3"),
  document.getElementById("loc4")
];

const locationLabels = [
  document.getElementById("loc1Label"),
  document.getElementById("loc2Label"),
  document.getElementById("loc3Label"),
  document.getElementById("loc4Label")
];

const loc4Wrap = document.getElementById("loc4Wrap");

/* =========================================
   3. COUNTRY CONFIGURATION
   ========================================= */

const countryConfig = {
  tz: {
    name: "Tanzania",
    flag: "🇹🇿",
    url: "https://api.openadmindata.org/api/v1/countries/tz.json",
    levels: [
      { key: "region", label: "Mkoa" },
      { key: "district", label: "Wilaya" },
      { key: "ward", label: "Kata" }
    ]
  },

  ke: {
    name: "Kenya",
    flag: "🇰🇪",
    url: "https://api.openadmindata.org/api/v1/countries/ke.json",
    levels: [
      { key: "county", label: "County" },
      { key: "subcounty", label: "Sub-county" },
      { key: "ward", label: "Ward" }
    ]
  },

  ug: {
    name: "Uganda",
    flag: "🇺🇬",
    url: "https://api.openadmindata.org/api/v1/countries/ug.json",
    levels: [
      { key: "region", label: "Region" },
      { key: "district", label: "District" },
      { key: "county", label: "County" },
      { key: "subcounty", label: "Sub-county" }
    ]
  }
};

let selectedCountry = null;
let locationData = null;
let requestNumber = 0;

/* =========================================
   4. MESSAGE HELPERS
   ========================================= */

function showMessage(text, type = "error") {
  message.textContent = text;
  message.className = type;
}

function clearMessage() {
  message.textContent = "";
  message.className = "";
}

/* =========================================
   5. SELECT HELPERS
   ========================================= */

function resetSelect(select, placeholder) {
  select.replaceChildren();

  const option = document.createElement("option");
  option.value = "";
  option.textContent = placeholder;

  select.appendChild(option);
  select.disabled = true;
}

function fillSelect(select, items, placeholder) {
  resetSelect(select, placeholder);

  for (const item of items) {
    const option = document.createElement("option");
    option.value = item.id;
    option.textContent = item.name;
    select.appendChild(option);
  }

  select.disabled = items.length === 0;

  if (items.length === 0) {
    select.options[0].textContent =
      "Hakuna maeneo yaliyopatikana";
  }
}

function getItems(levelKey) {
  if (!locationData) return [];

  const list = locationData[levelKey];

  if (!Array.isArray(list)) return [];

  return list.map(item => ({
    id: String(item.id),
    name:
      item.name_en ||
      item.name_local ||
      item.name?.en ||
      item.name?.local ||
      item.name ||
      "",
    parent_id:
      item.parent_id ??
      item.parent?.id ??
      null
  })).filter(item => item.name);
}

function getSelectedItem(index) {
  const select = locationSelects[index];

  if (!select.value) return null;

  return getItems(
    selectedCountry.levels[index].key
  ).find(item => item.id === select.value) || null;
}

/* =========================================
   6. LOAD COUNTRY DATA
   ========================================= */

async function loadCountry(code) {
  const thisRequest = ++requestNumber;

  selectedCountry = countryConfig[code];
  locationData = null;

  countryInput.value = code;

  locationSelects.forEach((select, index) => {
    resetSelect(select, "Inapakia...");
    locationLabels[index].textContent =
      (selectedCountry.levels[index]?.label || "Eneo") + " *";
  });

  loc4Wrap.classList.toggle(
    "hidden",
    selectedCountry.levels.length < 4
  );

  // Ficha ngazi ambazo hazitumiki kwa nchi hii.
  locationSelects.forEach((select, index) => {
    if (index >= selectedCountry.levels.length) {
      select.required = false;
      select.classList.add("hidden");
      locationLabels[index].classList.add("hidden");
    } else {
      select.required = true;
      select.classList.remove("hidden");
      locationLabels[index].classList.remove("hidden");
    }
  });

  // Uganda pekee inatumia ngazi ya nne katika usanidi huu.
  loc4Wrap.classList.toggle(
    "hidden",
    selectedCountry.levels.length < 4
  );

  clearMessage();

  try {
    const response = await fetch(selectedCountry.url);

    if (!response.ok) {
      throw new Error("API response " + response.status);
    }

    const payload = await response.json();

    if (thisRequest !== requestNumber) return;

    // API inaweka orodha za maeneo ndani ya payload.data.
    locationData = payload.data;

    if (!locationData ||
        !Array.isArray(
          locationData[selectedCountry.levels[0].key]
        )) {
      throw new Error("Muundo wa data haujatarajiwa.");
    }

    populateLevel(0);

  } catch (error) {
    console.error("Location loading error:", error);

    if (thisRequest !== requestNumber) return;

    locationSelects.forEach((select, index) => {
      resetSelect(
        select,
        selectedCountry.levels[index]
          ? "Imeshindikana kupakia maeneo"
          : "Haijatumika"
      );
    });

    showMessage(
      "Imeshindikana kupakia maeneo. Hakikisha intaneti inafanya kazi, kisha chagua nchi tena."
    );
  }
}

/* =========================================
   7. CASCADING LOCATION SELECTS
   ========================================= */

function populateLevel(index) {
  if (!selectedCountry || !locationData) return;

  const level = selectedCountry.levels[index];
  if (!level) return;

  let items = getItems(level.key);

  if (index > 0) {
    const parent = getSelectedItem(index - 1);

    if (!parent) {
      resetSelect(
        locationSelects[index],
        "Chagua eneo lililotangulia"
      );
      return;
    }

    items = items.filter(
      item => String(item.parent_id) === parent.id
    );
  }

  fillSelect(
    locationSelects[index],
    items,
    "Chagua " + level.label
  );
}

locationSelects.forEach((select, index) => {
  select.addEventListener("change", () => {
    // Futa ngazi zote zilizo chini ya iliyobadilika.
    for (let i = index + 1; i < locationSelects.length; i++) {
      resetSelect(
        locationSelects[i],
        selectedCountry?.levels[i]
          ? "Chagua eneo lililotangulia"
          : "Haijatumika"
      );
    }

    if (
      selectedCountry &&
      index + 1 < selectedCountry.levels.length
    ) {
      populateLevel(index + 1);
    }

    clearMessage();
  });
});

/* =========================================
   8. COUNTRY FLAG BUTTONS
   ========================================= */

document.querySelectorAll(".country-card").forEach(button => {
  button.addEventListener("click", () => {
    document.querySelectorAll(".country-card")
      .forEach(card => card.classList.remove("active"));

    button.classList.add("active");

    loadCountry(button.dataset.country);
  });
});

/* =========================================
   9. SUBMIT APPLICATION
   ========================================= */

form.addEventListener("submit", async event => {
  event.preventDefault();
  clearMessage();

  if (!selectedCountry || !countryInput.value) {
    showMessage("Tafadhali chagua nchi kwanza.");
    return;
  }

  // Mfumo huu unahitaji muuzaji awe ameingia.
  const { data: authData, error: authError } =
    await supabase.auth.getUser();

  if (authError || !authData.user) {
    showMessage(
      "Tafadhali ingia kwenye akaunti yako kabla ya kutuma maombi ya muuzaji."
    );
    return;
  }

  const user = authData.user;

  const chosenLocations = [];

  for (
    let i = 0;
    i < selectedCountry.levels.length;
    i++
  ) {
    const item = getSelectedItem(i);

    if (!item) {
      showMessage(
        "Tafadhali chagua " +
        selectedCountry.levels[i].label +
        "."
      );
      return;
    }

    chosenLocations.push({
      key: selectedCountry.levels[i].key,
      label: selectedCountry.levels[i].label,
      name: item.name
    });
  }

  const storeName =
    document.getElementById("store_name").value.trim();

  const ownerName =
    document.getElementById("owner_name").value.trim();

  const phone =
    document.getElementById("phone").value.trim();

  const email =
    document.getElementById("email").value.trim() ||
    user.email ||
    null;

  const category =
    document.getElementById("category").value;

  const street =
    document.getElementById("street").value.trim();

  const tinNumber =
    document.getElementById("tin_number").value.trim();

  const idType =
    document.getElementById("id_type").value;

  const idNumber =
    document.getElementById("id_number").value.trim();

  if (!storeName || !ownerName || !phone || !category) {
    showMessage(
      "Jaza taarifa zote zinazohitajika kabla ya kutuma."
    );
    return;
  }

  /*
   * Ramani ya kuhifadhi kwenye schema iliyopo:
   * region  = ngazi ya kwanza
   * district = ngazi ya pili
   * city = ngazi ya mwisho (inahitajika na jedwali)
   * street = mtaa/kijiji kinachoandikwa
   * address = ngazi zote zilizochaguliwa
   *
   * Kwa Kenya, ngazi ya kwanza ni County.
   * Kwa Uganda, city itakuwa Sub-county.
   */

  const regionName = chosenLocations[0].name;
  const districtName =
    chosenLocations[1]?.name || regionName;
  const cityName =
    chosenLocations[chosenLocations.length - 1].name;

  const addressParts = chosenLocations.map(
    item => item.label + ": " + item.name
  );

  if (street) {
    addressParts.push("Mtaa/Kijiji: " + street);
  }

  const application = {
    id: crypto.randomUUID(),
    store_name: storeName,
    business_name: storeName,
    owner_name: ownerName,
    phone: phone,
    country: selectedCountry.name,
    region: regionName,
    district: districtName,
    city: cityName,
    street: street || null,
    address: addressParts.join(", "),
    email: email,
    category: category,
    tin_number: tinNumber || null,
    id_type: idType || null,
    id_number: idNumber || null,
    status: "pending"
  };

  submitBtn.disabled = true;
  submitBtn.textContent = "Inatuma maombi...";

  try {
    const { error } = await supabase
      .from("seller_applications")
      .insert(application);

    if (error) {
      console.error("Supabase insert error:", error);
      throw error;
    }

    showMessage(
      "Maombi yako yametumwa kwa mafanikio. Subiri yakaguliwe na msimamizi.",
      "success"
    );

    form.reset();

    document.querySelectorAll(".country-card")
      .forEach(card => card.classList.remove("active"));

    countryInput.value = "";
    selectedCountry = null;
    locationData = null;

    locationSelects.forEach((select, index) => {
      resetSelect(
        select,
        index === 0
          ? "Chagua nchi kwanza"
          : "Chagua eneo lililotangulia"
      );
    });

    loc4Wrap.classList.add("hidden");

  } catch (error) {
    let errorText =
      error?.message || "Hitilafu isiyojulikana.";

    if (
      errorText.includes("row-level security") ||
      errorText.includes("policy")
    ) {
      errorText =
        "Supabase imezuia ombi kwa sera za RLS. Hakikisha sera ya INSERT inaruhusu watumiaji walioingia kutuma maombi.";
    } else if (
      errorText.includes("column") ||
      errorText.includes("schema cache")
    ) {
      errorText =
        "Kuna tofauti kati ya code na columns za seller_applications. Angalia ujumbe wa kosa kwenye Console.";
    }

    showMessage("Maombi hayakutumika: " + errorText);
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = "Tuma maombi";
  }
});
</script>
