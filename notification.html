<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZUNE - Taarifa na Shughuli Zangu</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts & FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-brand { font-family: 'Space Grotesk', sans-serif; }
    .stylish-gradient { background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #2563eb 100%); }
  </style>

  <script type="module" src="./notification.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased pb-20">

  <!-- TOP HEADER BAR -->
  <header class="stylish-gradient text-white py-3 px-4 shadow-md sticky top-0 z-50">
    <div class="container mx-auto flex items-center justify-between">
      <a href="./index.html" class="flex items-center gap-2 text-white hover:text-sky-300 font-bold text-xs transition">
        <i class="fa-solid fa-arrow-left text-sm"></i> Rudi Mwanzo
      </a>
      <span class="font-brand text-xl font-bold tracking-tight text-white">ZUNE TAARIFA</span>
    </div>
  </header>

  <main class="container mx-auto px-4 my-6 max-w-xl">
    <div class="flex items-center justify-between mb-4">
      <h2 class="font-brand text-lg font-bold text-slate-900">Shughuli na Taarifa Zako</h2>
      <span id="notif-count" class="bg-blue-100 text-blue-600 text-xs font-bold px-2.5 py-1 rounded-full">0 Mpya</span>
    </div>

    <!-- Eneo la Kuonyesha Taarifa -->
    <div id="notifications-list" class="space-y-3">
      <div class="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm text-center py-12">
        <i class="fa-solid fa-circle-notch fa-spin text-blue-600 text-2xl mb-2"></i>
        <p class="text-slate-500 text-xs font-medium">Inapakia taarifa zako...</p>
      </div>
    </div>
  </main>

  <!-- MOBILE BOTTOM NAVIGATION BAR -->
  <div class="md:hidden fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-slate-200 py-2.5 px-4 z-50 shadow-lg">
    <div class="flex justify-between items-center max-w-md mx-auto">
      <a href="./index.html" class="flex flex-col items-center text-slate-500 hover:text-blue-600 transition">
        <i class="fa-solid fa-house text-lg"></i>
        <span class="text-[10px] mt-1">Mwanzo</span>
      </a>
      <a href="#" class="flex flex-col items-center text-slate-500 hover:text-blue-600 transition">
        <i class="fa-solid fa-layer-group text-lg"></i>
        <span class="text-[10px] mt-1">Kategoria</span>
      </a>
      <a href="./seller.html" class="flex flex-col items-center -mt-6">
        <div class="bg-gradient-to-r from-blue-600 to-indigo-600 text-white h-12 w-12 rounded-full flex items-center justify-center shadow-lg shadow-blue-500/40 border-4 border-slate-50">
          <i class="fa-solid fa-plus text-xl"></i>
        </div>
        <span class="text-[10px] mt-0.5 font-bold text-slate-700">Uza Bidhaa</span>
      </a>
      <a href="#" class="flex flex-col items-center text-slate-500 hover:text-blue-600 transition">
        <i class="fa-solid fa-wallet text-lg"></i>
        <span class="text-[10px] mt-1">Wallet</span>
      </a>
      <a href="./notification.html" class="flex flex-col items-center text-blue-600 font-bold transition">
        <div class="relative">
          <i class="fa-regular fa-bell text-lg"></i>
        </div>
        <span class="text-[10px] mt-1">Taarifa</span>
      </a>
    </div>
  </div>

</body>
</html>
