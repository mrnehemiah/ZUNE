<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZUNE Marketplace - Soko Kuu la Afrika Mashariki</title>
  
  <!-- AUTH GUARD: Mzuie mtumiaji asiye na akaunti -->
  <script>
    const isLogged = localStorage.getItem('zune_logged_in') === 'true';
    if (!isLogged) {
      alert("Samahani! Lazima uwe na akaunti na uwe umeingia ndipo utumie ZUNE Marketplace.");
      window.location.href = './login.html';
    }
  </script>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-brand { font-family: 'Space Grotesk', sans-serif; }
    .stylish-gradient { background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #2563eb 100%); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased pb-24">

  <header class="stylish-gradient text-white sticky top-0 z-50 shadow-lg">
    <div class="container mx-auto px-4 py-3 max-w-xl">
      <div class="flex items-center justify-between mb-3">
        <a href="./index.html" class="flex items-center gap-2">
          <div class="h-9 w-9 bg-blue-600 rounded-xl flex items-center justify-center font-brand font-extrabold text-white text-xl shadow-md border border-blue-400/30">
            Z
          </div>
          <div>
            <span class="font-brand text-xl font-bold tracking-tight text-white block leading-none">ZUNE</span>
            <span class="text-[9px] text-sky-300 font-medium tracking-widest uppercase">MARKETPLACE</span>
          </div>
        </a>

        <div class="flex items-center gap-3">
          <a href="./cart.html" class="relative bg-white/10 p-2 rounded-xl text-white hover:bg-white/20 transition">
            <i class="fa-solid fa-cart-shopping text-base"></i>
            <span id="cartBadge" class="absolute -top-1 -right-1 bg-rose-500 text-white text-[9px] font-extrabold h-4 w-4 rounded-full flex items-center justify-center">0</span>
          </a>
        </div>
      </div>

      <div class="relative">
        <input type="text" id="mainSearchInput" placeholder="Tafuta bidhaa, duka, au kategoria..." class="w-full bg-white text-slate-800 rounded-2xl px-4 py-2.5 pl-10 text-xs shadow-inner focus:outline-none focus:ring-2 focus:ring-blue-500 font-medium">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
      </div>
    </div>
  </header>

  <main class="container mx-auto px-4 my-5 max-w-xl space-y-6">
    <div class="relative rounded-3xl overflow-hidden shadow-xl bg-gradient-to-r from-blue-700 to-indigo-900 text-white p-6">
      <div class="relative z-10 max-w-[70%]">
        <span class="bg-amber-400 text-slate-900 text-[9px] font-extrabold px-2.5 py-0.5 rounded-full uppercase tracking-wider mb-2 inline-block">OFFER MPYA</span>
        <h2 class="font-brand text-lg font-bold leading-tight">Nunua Bidhaa Bora za EAC kwa Bei Nafuu!</h2>
        <p class="text-[11px] text-blue-100 mt-1">Usafirishaji wa haraka na salama kote Afrika Mashariki.</p>
        <a href="./category.html" class="inline-block mt-3 bg-white text-blue-700 font-extrabold text-xs px-4 py-2 rounded-xl shadow-md hover:bg-blue-50 transition">
          Kagua Sokoni <i class="fa-solid fa-arrow-right ml-1"></i>
        </a>
      </div>
      <i class="fa-solid fa-bag-shopping absolute -right-4 -bottom-6 text-9xl text-white/10 transform -rotate-12 pointer-events-none"></i>
    </div>

    <div>
      <div class="flex items-center justify-between mb-3">
        <h3 class="font-brand font-bold text-sm text-slate-800">Bidhaa Zilizopo Sokoni</h3>
        <span class="text-[10px] text-emerald-600 bg-emerald-50 font-extrabold px-2 py-0.5 rounded-full">Zilizohakikiwa</span>
      </div>

      <div id="homeProductsGrid" class="grid grid-cols-2 gap-3">
        <!-- Bidhaa zitajazwa hapa -->
      </div>
    </div>
  </main>

  <div class="md:hidden fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-slate-200 py-2.5 px-4 z-50 shadow-lg">
    <div class="flex justify-between items-center max-w-md mx-auto">
      <a href="./index.html" class="flex flex-col items-center text-blue-600 font-bold transition">
        <i class="fa-solid fa-house text-lg"></i>
        <span class="text-[10px] mt-1">Mwanzo</span>
      </a>
      <a href="./category.html" class="flex flex-col items-center text-slate-500 hover:text-blue-600 transition">
        <i class="fa-solid fa-layer-group text-lg"></i>
        <span class="text-[10px] mt-1">Kategoria</span>
      </a>
      <a href="./seller-dashboard.html" class="flex flex-col items-center -mt-6">
        <div class="bg-gradient-to-r from-blue-600 to-indigo-600 text-white h-12 w-12 rounded-full flex items-center justify-center shadow-lg shadow-blue-500/40 border-4 border-slate-50">
          <i class="fa-solid fa-store text-xl"></i>
        </div>
        <span class="text-[10px] mt-0.5 font-bold text-slate-700">Duka Langu</span>
      </a>
      <a href="./wallet.html" class="flex flex-col items-center text-slate-500 hover:text-blue-600 transition">
        <i class="fa-solid fa-wallet text-lg"></i>
        <span class="text-[10px] mt-1">Wallet</span>
      </a>
      <a href="./account.html" class="flex flex-col items-center text-slate-500 hover:text-blue-600 transition">
        <i class="fa-solid fa-user text-lg"></i>
        <span class="text-[10px] mt-1">Akaunti</span>
      </a>
    </div>
  </div>

  <script>
    const sampleProducts = [
      { id: '1', title: 'Smartphone 128GB Pro', price: 350000, image_url: 'https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=300' },
      { id: '2', title: 'Subwoofer ya Nyumbani', price: 180000, image_url: 'https://images.unsplash.com/photo-1546435770-a3e426bf472b?w=300' },
      { id: '3', title: 'Shati la Kiume la Kisasa', price: 35000, image_url: 'https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=300' },
      { id: '4', title: 'Perfume ya Urembo', price: 45000, image_url: 'https://images.unsplash.com/photo-1522337360788-8b13dee7a37e?w=300' }
    ]

    document.addEventListener('DOMContentLoaded', () => {
      renderHomeProducts()
      updateCartBadge()
    })

    function renderHomeProducts() {
      const container = document.getElementById('homeProductsGrid')
      if (!container) return

      let customProds = []
      try { customProds = JSON.parse(localStorage.getItem('zune_all_products')) || [] } catch(e) { customProds = [] }

      const allProds = customProds.length > 0 ? customProds.concat(sampleProducts) : sampleProducts
      container.innerHTML = ''

      allProds.forEach(p => {
        const card = document.createElement('div')
        card.className = 'bg-white rounded-2xl border border-slate-100 p-3 flex flex-col justify-between shadow-sm hover:shadow-md transition'
        card.innerHTML = `
          <div>
            <div class="h-28 bg-slate-50 rounded-xl overflow-hidden mb-2">
              <img src="${p.image_url}" alt="${p.title}" class="w-full h-full object-cover">
            </div>
            <h4 class="font-bold text-xs text-slate-800 line-clamp-1">${p.title}</h4>
          </div>
          <div class="mt-2">
            <p class="text-blue-600 font-brand font-extrabold text-xs mb-2">TZS ${Number(p.price).toLocaleString()}</p>
            <div class="grid grid-cols-2 gap-1.5">
              <button onclick="addToCart('${p.id}', '${p.title.replace(/'/g, "\\'")}', ${p.price})" class="bg-blue-600 hover:bg-blue-700 text-white text-[9px] font-bold py-1.5 rounded-lg transition text-center">
                + Kikapu
              </button>
              <a href="./chat.html" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-[9px] font-bold py-1.5 rounded-lg transition text-center flex items-center justify-center gap-1">
                <i class="fa-regular fa-comment text-blue-600"></i> Chat
              </a>
            </div>
          </div>
        `
        container.appendChild(card)
      })
    }

    function addToCart(id, title, price) {
      let cart = []
      try { cart = JSON.parse(localStorage.getItem('zune_cart')) || [] } catch (e) { cart = [] }

      const existing = cart.find(item => item.id === id)
      if (existing) {
        existing.quantity = (existing.quantity || 1) + 1
      } else {
        cart.push({ id, title, price, quantity: 1 })
      }

      localStorage.setItem('zune_cart', JSON.stringify(cart))
      updateCartBadge()
      alert(`"${title}" imeongezwa kwenye kikapu!`)
    }

    function updateCartBadge() {
      let cart = []
      try { cart = JSON.parse(localStorage.getItem('zune_cart')) || [] } catch (e) { cart = [] }
      const badge = document.getElementById('cartBadge')
      if (badge) badge.innerText = cart.reduce((total, item) => total + (item.quantity || 1), 0)
    }
  </script>
</body>
</html>
