<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZUNE - Soko Lako Mtandaoni</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="module" src="./app.js"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-800">

  <!-- Header -->
  <header class="bg-blue-600 text-white p-4 shadow-md sticky top-0 z-50">
    <div class="container mx-auto flex justify-between items-center">
      <h1 class="text-2xl font-bold tracking-wider">ZUNE</h1>
      <span class="text-xs bg-blue-800 px-2 py-1 rounded">Marketplace</span>
    </div>
  </header>

  <!-- Hero Banner -->
  <section class="bg-blue-500 text-white py-8 px-4 text-center">
    <h2 class="text-2xl font-extrabold mb-2">Nunua na Uze kwa Urahisi</h2>
    <p class="text-sm opacity-90">Jukwaa linalokutanisha wauzaji na wateja mahali pamoja.</p>
  </section>

  <!-- Main Container -->
  <main class="container mx-auto p-4">
    <h3 class="text-xl font-bold mb-4 text-gray-700">Bidhaa Mpya</h3>
    
    <!-- Loading Message -->
    <div id="loading" class="text-center py-8 text-gray-500">
      Inapakia bidhaa za ZUNE...
    </div>

    <!-- Product Grid -->
    <div id="products-grid" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div>
  </main>

</body>
  </html>
